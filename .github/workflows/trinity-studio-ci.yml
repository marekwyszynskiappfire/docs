name: Trinity Studio CI

on:
  push:
    paths:
      - "Trinity/studio/**"
      - "Trinity/shared/**"
      - "Trinity/VERSION"
      - ".github/workflows/trinity-studio-ci.yml"
  pull_request:
    paths:
      - "Trinity/studio/**"
      - "Trinity/shared/**"
      - "Trinity/VERSION"
      - ".github/workflows/trinity-studio-ci.yml"

jobs:
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Trinity/studio

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Trinity/studio/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Pytest (API + shared validation)
        env:
          TRINITY_GIT_REVISION: ${{ github.sha }}
        run: pytest tests -q

      - name: Assert Trinity VERSION matches release module
        run: |
          V="$(tr -d ' \r' < ../VERSION | head -1)"
          test -n "$V"
          echo "Trinity release version: $V"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Trinity/studio/web/package-lock.json

      - name: Install web dependencies
        working-directory: Trinity/studio/web
        run: npm ci

      - name: Vitest
        working-directory: Trinity/studio/web
        run: npm test

      - name: Production build
        working-directory: Trinity/studio/web
        run: npm run build
